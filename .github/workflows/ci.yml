name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Unit tests
        env:
          # 测试全部走 mock/sample 源，无需真实密钥
          PRODUCT_SOURCE: sample
          SUPPLIER_SOURCE: sample
          RAG_BACKEND: memory
          LLM_API_KEY: sk-test-placeholder
        run: |
          python -m pytest tests/unit -q --no-cov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Build
        run: npm run build
