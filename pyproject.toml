[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-ecommerce-agent"
version = "0.1.0"
description = "TikTok 跨境选品与上架全链路多 Agent 系统（企业级工程框架）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["tiktok", "ecommerce", "agent", "rag", "langgraph"]
dependencies = [
    # ---- LLM / Agent 框架 ----
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "openai>=1.40.0",
    # ---- 向量库 ----
    "pymilvus>=2.4.0",
    # ---- 爬虫 ----
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tenacity>=8.0.0",
    # ---- 图片处理 ----
    "pillow>=10.0.0",
    # OCR（图上文字识别）：RapidOCR ONNX 实现，CPU 稳定，离线免费
    "rapidocr-onnxruntime>=1.3.0",
    # ---- 配置 / 校验 ----
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # ---- API 服务 ----
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "pre-commit>=3.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
tiktok-agent = "tiktok_ecommerce.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

# ==================== 测试配置 ====================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=tiktok_ecommerce --cov-report=term-missing"
markers = [
    "integration: 需要真实依赖（Milvus/LLM API）的集成测试",
]

# ==================== 代码质量 ====================
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]  # 行长度交给 ruff format 处理

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
# 说明：新项目从非 strict 起步，逐步提高类型覆盖

# ==================== 依赖锁定 ====================
# 生产环境安装：pip install .
# 开发环境安装：pip install -e ".[dev]"
# 锁文件（可选，团队协作时用）：pip-compile pyproject.toml
